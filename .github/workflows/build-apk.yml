name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ShawezGPT Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-v1.2.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-Latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ShawezGPT.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShawezGPT-Android-APK
          path: apk-output/ShawezGPT-v1.2.2.apk
          retention-days: 30

      - name: Publish GitHub Release v1.2.2
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "ShawezGPT v1.2.2 (Instant Real-time Streaming & OmniRoute Fix)"
          body: |
            ### ⚡ ShawezGPT v1.2.2 — Instant Real-Time Streaming & OmniRoute Release

            - **⚡ Fixed Response Streaming Timeout**: Removed premature 3s abort timer in client `api.ts`, ensuring continuous, uninterrupted streaming for long answers, code blocks, and complex reasoning queries.
            - **🌐 OmniRoute Dynamic Intelligence**: Instant real-time routing for coding, reasoning, research, and general conversations.
            - **🤖 Ruflo 6-AI Swarm Execution**: Multi-agent coordination with real-time stream delivery.
            - **🎯 Clean & Accurate Direct Answers**: Zero robotic preambles or unwanted self-introductions.
            - **✨ ChatGPT-Style UI & Dropdown**: Seamless tabs, search bar, active checkmarks, and outside-click dismissal.
            - **📱 Mobile Android APK Ready**: Direct download `ShawezGPT.apk` or `ShawezGPT-v1.2.2.apk` below!
          files: |
            apk-output/ShawezGPT-v1.2.2.apk
            apk-output/ShawezGPT-Latest.apk
            releases/ShawezGPT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
