name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ShawezGPT Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-v1.1.9.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-Latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ShawezGPT.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShawezGPT-Android-APK
          path: apk-output/ShawezGPT-v1.1.9.apk
          retention-days: 30

      - name: Publish GitHub Release v1.1.9
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.9
          name: "ShawezGPT v1.1.9 (Live API Research & Zero-Error Fix Edition)"
          body: |
            ### 🌟 ShawezGPT v1.1.9 Production Fix Release
            - **⚡ API Research & Live Fix**: Fixed Pollinations live endpoint from deprecated /openai path (which was returning 402) to https://text.pollinations.ai/.
            - **🔄 Vite API Proxy**: Added local proxy in `vite.config.ts` for seamless routing from frontend to backend.
            - **📱 Mobile APK Zero-Quota Engine**: Direct client-side streaming from Gemini 2.5 + Live Pollinations fallback.
            - **🤖 Ruflo 6-AI Swarm Engine**: RufloIntelligence, RufloBrowser, RufloRAGMemory, RufloSwarmCoord, RufloAutoAgent, and RufloSecurity.
            - **📱 Android APK**: Download `ShawezGPT.apk` or `ShawezGPT-v1.1.9.apk` below and install on Android.
          files: |
            apk-output/ShawezGPT-v1.1.9.apk
            apk-output/ShawezGPT-Latest.apk
            releases/ShawezGPT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
