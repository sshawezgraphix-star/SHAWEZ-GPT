name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ShawezGPT Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-v1.1.6.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-Latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ShawezGPT.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShawezGPT-Android-APK
          path: apk-output/ShawezGPT-v1.1.6.apk
          retention-days: 30

      - name: Publish GitHub Release v1.1.6
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.6
          name: "ShawezGPT v1.1.6 (Zero-Limit Multi-Swarm & AI Image Studio Edition)"
          body: |
            ### 🌟 ShawezGPT v1.1.6 SuperApp Android Release
            - **⚡ 4-Key Zero Rate Limit Engine**: Automatic round-robin load balancing & 0ms failover across 4 Gemini API keys (4,000,000 Tokens/Min).
            - **🎨 100% Free AI Image Studio**: Flux Pro, Photoreal 8K, Anime, 3D Render, and real-time photo editing suite.
            - **🧠 World-Class Flagship Models**: Claude 3.5 Sonnet, ChatGPT-4o, DeepSeek-R1, and Meta Llama 3.3.
            - **🦙 Ollama Zero-Timeout Native Socket Engine**: Instant streaming without connection drops.
            - **📄 1-Click Resume & PDF Studio**: Draft ATS resumes and compile professional reports on mobile.
            - **📱 Android APK**: Download `ShawezGPT.apk` or `ShawezGPT-v1.1.6.apk` below and install on Android.
          files: |
            apk-output/ShawezGPT-v1.1.6.apk
            apk-output/ShawezGPT-Latest.apk
            releases/ShawezGPT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
