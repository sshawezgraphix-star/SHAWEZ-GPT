name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ShawezGPT Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ShawezGPT-v1.0.9.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ShawezGPT.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShawezGPT-Android-APK
          path: apk-output/ShawezGPT-v1.0.9.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.9
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "ShawezGPT v1.0.9 (Flagship Multi-Model AI Hub & Resume Studio Edition)"
          body: |
            ### 🌟 ShawezGPT v1.0.9 SuperApp Flagship Release
            - **🧠 World's Top Flagship Models**: Claude 3.5 Sonnet, GPT-4o, DeepSeek-R1, and Shawez Gemini Turbo 2.5
            - **📄 1-Click Resume & CV Studio**: Draft ATS-compliant resumes and export print-ready PDFs
            - **💻 Live Code Sandbox & Interactive Runner**: Execute HTML, CSS, JavaScript, and UI components in-app
            - **📑 Direct PDF Document Exporter**: 1-click download of resumes, reports, and code documentation
            - **⚡ Universal Smart Router**: Zero rate-limit failover across Puter.js and 3-Key Gemini pool
          files: |
            apk-output/ShawezGPT-v1.0.9.apk
            releases/ShawezGPT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
